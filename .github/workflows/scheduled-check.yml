name: Scheduled repository maintenance

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-actions-lab-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update managed file inventory
        run: python scripts/scheduled_check.py --update

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Python indentation
        run: python -m tabnanny scripts tests

      - name: Validate generated change and commit if needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- README.md

          if git diff --cached --quiet; then
            echo "No meaningful README inventory change; skipping commit."
            echo "No documentation change was needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed_paths="$(git diff --cached --name-only)"
          if [[ "$changed_paths" != "README.md" ]]; then
            echo "Refusing to commit unexpected paths: $changed_paths" >&2
            exit 1
          fi

          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync automation file inventory"
          git push
          echo "Committed a validated README inventory update." >> "$GITHUB_STEP_SUMMARY"
