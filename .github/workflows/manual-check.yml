name: Manual repository check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-actions-lab-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check managed file inventory
        run: python scripts/scheduled_check.py --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Python indentation
        run: python -m tabnanny scripts tests

      - name: Check whitespace
        run: git diff --check
